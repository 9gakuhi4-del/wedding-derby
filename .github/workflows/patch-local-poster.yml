name: Patch local poster and race markers
on:
  push:
    paths:
      - '.github/workflows/patch-local-poster.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          start=s.index("const POSTER_URL='")
          end=s.index("';",start)+2
          s=s[:start]+"const POSTER_URL='/race-poster.png';"+s[end:]
          old="style=\"left:calc(24px + (100% - 48px) * ${Math.max(0,Math.min(100,h.progress))/100});background:${COLORS[h.slot]};color:${TEXT[h.slot]}\""
          new="style=\"left:${4+92*(Math.max(0,Math.min(100,h.progress))/100)}%;background:${COLORS[h.slot]};color:${TEXT[h.slot]}\""
          if old not in s:
              raise SystemExit('runner marker expression not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "wedding-derby-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Use local race poster and fix number markers" || exit 0
          git push
