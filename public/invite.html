<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1d18"><title>結婚記念杯 — 事前配布用QR</title><link rel="stylesheet" href="/entry.css?v=fixed-entry-1"><script defer src="/invite.js?v=fixed-entry-1"></script></head><body><main><p class="eyebrow">THE WEDDING GRAND PRIX</p><h1>結婚記念杯</h1><p class="intro">あなたの手で、勝利をつかもう。</p><img class="qrImage" src="/guest-qr.png" width="984" height="984" alt="結婚記念杯の固定ゲスト入口QRコード"><h2>スマホで読み取って参加</h2><ol class="steps"><li>QRを読み取り、受付開始まで待機</li><li>自分の出走番号と名前を選ぶ</li><li>「準備OK」を押し、会場の合図を待つ</li></ol><p class="fine">ルームコードの入力は不要です。<br>参加する9人とも、同じQRを使えます。</p><a class="guestLink" href="/entry.html">wedding-derby-live.onrender.com/entry.html</a><div class="raceInfo"><span>9頭</span><span>芝 1,400m</span><span>8番 新婦</span></div><div class="actions noPrint"><a class="button" href="/guest-qr.png" download="wedding-derby-guest-qr.png">QR画像を保存</a><button id="printInvite" type="button">この案内を印刷</button></div><p class="fine noPrint printNote">印刷するときはQRを3cm角以上にし、周囲の白い余白を残してください。事前にスマホで読み取りを確認してください。</p></main></body></html>
