<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071810">
<title>結婚記念杯｜Wedding Derby Live</title>
<style>
:root{--bg:#06130e;--panel:#102f24;--panel2:#0b251b;--line:#365847;--gold:#edc775;--cream:#ffe4aa;--text:#fff;--muted:#bdd0c5;--red:#b43d3a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#14382a 0,#06130e 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;overscroll-behavior:none}button,input,select{font:inherit}.hidden{display:none!important}.wrap{width:min(1240px,100%);margin:auto;padding:10px}.card{background:linear-gradient(180deg,rgba(18,57,43,.98),rgba(8,31,23,.98));border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0;box-shadow:0 12px 35px #0005}.brand{text-align:center}.brand .eyebrow{font-size:10px;letter-spacing:.32em;color:#dbc485}.brand h1{margin:3px 0;color:#f4d48d;font-size:28px;letter-spacing:.14em}.brand p{margin:3px;color:#c9d9d0;font-size:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:160px}.btn{border:0;border-radius:12px;background:var(--gold);color:#261c0b;padding:11px 15px;font-weight:900;box-shadow:0 3px 0 #96702d;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #96702d}.btn.dark{background:#1d4937;color:#fff;border:1px solid #527260;box-shadow:none}.btn.red{background:var(--red);color:#fff;box-shadow:none}.btn:disabled{opacity:.4;transform:none}input,select{background:#071d15;color:#fff;border:1px solid #496b59;border-radius:10px;padding:10px}.full{width:100%}.large{min-height:66px;font-size:18px}.tiny{font-size:11px;color:var(--muted)}.code{font:900 27px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--cream)}
#landing,#joinCard,#player{max-width:540px;margin-left:auto;margin-right:auto}.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.joinGrid{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.hostGrid{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}.nameGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px;margin-top:10px}.nameRow{display:grid;grid-template-columns:34px 1fr 52px;gap:5px;align-items:center}.numMini{width:31px;height:31px;border-radius:7px;display:grid;place-items:center;font-weight:1000;border:2px solid #ffffffc9}.statusTag{font-size:10px;border-radius:99px;padding:4px 6px;text-align:center;background:#4a5550}.statusTag.ready{background:#287c46}.links{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.linkBox{background:#061d15;border:1px solid #335545;border-radius:9px;padding:8px;font-size:10px;word-break:break-all}.qr{background:#fff;border-radius:10px;padding:7px;width:max-content;max-width:100%;margin-top:8px}
#raceView{position:relative}.stage{height:min(60vw,670px);min-height:390px;position:relative;overflow:hidden;border-radius:16px;border:2px solid #ac8a50;background:#050a07;box-shadow:0 20px 55px #000a}.stage:fullscreen{height:100vh!important;width:100vw!important;border:0;border-radius:0}.cinematic,.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cinematic{z-index:1;background:#000}.poster{z-index:0;transition:opacity .3s;transform:scale(1.04)}.poster.moving{animation:kenburns 15s linear forwards}@keyframes kenburns{from{transform:scale(1.04) translateX(0)}to{transform:scale(1.14) translateX(-1.5%)}}.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(#03100bcf 0,transparent 24%,transparent 66%,#03100bd9 100%);pointer-events:none}.hud{position:absolute;inset:0;z-index:2;pointer-events:none}.topHud{position:absolute;top:8px;left:9px;right:9px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.pill{background:#061811e8;border:1px solid #ffffff27;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:900;backdrop-filter:blur(5px)}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#f33;box-shadow:0 0 9px #f33;margin-right:6px}.phase{font-size:13px}.leaderboard{position:absolute;top:48px;right:9px;width:min(270px,47%);background:#04140eea;border:1px solid #ffffff2b;border-radius:10px;padding:7px;backdrop-filter:blur(5px)}.leadRow{display:grid;grid-template-columns:30px 1fr auto;gap:7px;align-items:center;padding:4px 0;border-bottom:1px solid #ffffff13;font-size:12px}.leadRow:last-child{border:0}.leadNo{height:27px;border-radius:6px;display:grid;place-items:center;font-size:17px;font-weight:1000;border:2px solid #fff}.bride{color:#ffe29b;font-size:9px;font-weight:900}.commentary{position:absolute;left:9px;bottom:95px;max-width:74%;background:#04140eea;border:1px solid #ffffff2b;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:900;line-height:1.45;backdrop-filter:blur(5px)}.raceStrip{position:absolute;left:9px;right:9px;bottom:10px;height:73px;background:#04140eea;border:1px solid #ffffff2b;border-radius:11px;padding:13px 18px 8px;backdrop-filter:blur(5px)}.trackLine{position:absolute;left:24px;right:24px;top:34px;height:8px;border-radius:99px;background:linear-gradient(90deg,#2d7040,#4aa75d);border:1px solid #ffffff90}.finishLine{position:absolute;right:24px;top:18px;bottom:8px;width:8px;background:repeating-linear-gradient(0deg,#fff 0 6px,#111 6px 12px)}.runnerDot{position:absolute;top:17px;width:34px;height:34px;margin-left:-17px;border-radius:50%;display:grid;place-items:center;font-weight:1000;font-size:18px;border:3px solid #fff;box-shadow:0 4px 12px #000;transition:left .12s linear;z-index:3}.runnerDot.brideDot{border-color:#f4d274;box-shadow:0 0 16px #ffe09a}.startLabel,.finishLabel{position:absolute;bottom:4px;font-size:9px;color:#c5d6cc}.startLabel{left:19px}.finishLabel{right:17px}.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(21vw,150px);font-weight:1000;color:#ffe19b;text-shadow:0 7px 30px #000}.winner{position:absolute;inset:0;z-index:8;background:#03100ddb;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.winnerNo{font-size:min(22vw,170px);font-weight:1000;line-height:.9}.winnerName{font-size:min(7vw,48px);font-weight:1000;color:#ffe09a}.finishList{margin-top:14px;font-size:min(3.4vw,19px);line-height:1.65}.videoNotice{position:absolute;left:9px;top:48px;background:#061811d8;border-radius:7px;padding:5px 8px;font-size:10px;color:#c9d9d0}
.playerHead{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.playerNo{width:64px;height:64px;border:3px solid #fff;border-radius:12px;display:grid;place-items:center;font-size:34px;font-weight:1000}.meter{height:20px;background:#071c15;border:1px solid #345846;border-radius:99px;overflow:hidden}.meterFill{height:100%;width:100%;background:#5dcc7b;transition:width .1s linear,background .15s}.tap{width:100%;height:165px;border:0;border-radius:22px;background:linear-gradient(#f3d386,#dda84c);color:#281b08;font-size:30px;font-weight:1000;box-shadow:0 9px 0 #9c712d;touch-action:manipulation;user-select:none;-webkit-user-select:none;margin-top:12px}.tap:active{transform:translateY(5px);box-shadow:0 4px 0 #9c712d}.tap:disabled{opacity:.38;transform:none}.playerStatus{text-align:center;font-weight:900;margin:10px}.result{white-space:pre-line;text-align:center;line-height:1.7;font-weight:900}.connDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:5px}.connDot.on{background:#55d479;box-shadow:0 0 9px #55d479}.error{position:fixed;left:10px;right:10px;bottom:10px;background:#8b3432;color:#fff;padding:11px;border-radius:11px;z-index:99;text-align:center;font-weight:800}
@media(max-width:680px){.wrap{padding:7px}.brand h1{font-size:22px}.modeGrid{grid-template-columns:1fr}.hostGrid{grid-template-columns:1fr 1fr}.hostGrid .roomCell{grid-column:1/-1}.links{grid-template-columns:1fr}.stage{height:470px}.leaderboard{width:155px}.leadRow{grid-template-columns:27px 1fr;font-size:10px}.leadRow>span:last-child{display:none}.commentary{max-width:94%;bottom:95px;font-size:10px}.nameGrid{grid-template-columns:1fr 1fr}.nameRow{grid-template-columns:30px 1fr}.nameRow .statusTag{grid-column:1/-1}.raceStrip{height:70px}.runnerDot{width:29px;height:29px;margin-left:-14px;font-size:15px}.links{display:none}}
</style>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
<section class="brand card"><div class="eyebrow">WEDDING DERBY LIVE</div><h1>結 婚 記 念 杯</h1><p>追う・控える × スタミナ × リアルタイム競馬</p></section>
<section id="landing" class="card"><h2 style="margin-top:0">レースを始める</h2><div class="modeGrid"><button id="newRace" class="btn large">新しいレースを作る</button><button id="joinOpen" class="btn dark large">参加者として入る</button></div><div id="joinBox" class="joinGrid hidden"><input id="joinCode" maxlength="5" placeholder="ルームコード" style="text-transform:uppercase"><button id="joinNext" class="btn">次へ</button></div><p class="tiny">参加者は各自の4G・5Gから参加できます。同じWi‑Fiは不要です。</p></section>
<section id="joinCard" class="card hidden"><div class="tiny">ROOM</div><div id="joinCodeView" class="code"></div><label for="horseSlot">出走番号（8番は新婦）</label><select id="horseSlot" class="full"><option value="0">1番</option><option value="1">2番</option><option value="2">3番</option><option value="3">4番</option><option value="4">5番</option><option value="5">6番</option><option value="6">7番</option><option value="7">8番 新婦</option></select><input id="playerName" class="full" maxlength="14" placeholder="馬名・出席者名" style="margin:10px 0"><button id="joinRace" class="btn large full">この名前で出走登録</button></section>
<section id="host" class="hidden"><div class="card"><div class="hostGrid"><div class="roomCell"><span class="tiny">ROOM</span> <span id="roomCode" class="code"></span></div><button id="startRace" class="btn">発走</button><button id="resetRace" class="btn dark">リセット</button></div><div class="row between" style="margin-top:9px"><label>出走頭数 <select id="count"><option>6</option><option selected>8</option><option>9</option></select></label><span id="joinedText" class="tiny"></span><button id="fullBtn" class="btn dark">大画面</button></div><div id="hostNames" class="nameGrid"></div><div class="links"><div><div class="tiny">参加者用URL</div><div id="joinUrl" class="linkBox"></div></div><div><div class="tiny">観戦用URL</div><div id="screenUrl" class="linkBox"></div></div></div><div id="qr" class="qr"></div></div></section>
<section id="screenOnly" class="card hidden"><div class="row between"><div>ROOM <span id="screenCode" class="code"></span></div><button id="screenFull" class="btn dark">全画面</button></div></section>
<section id="raceView" class="hidden"><div id="stage" class="stage"><video id="raceFilm" class="cinematic hidden" muted playsinline webkit-playsinline preload="auto" poster="/race-poster.png"></video><img id="racePoster" class="poster" alt="競馬場"><canvas id="raceCanvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:1"></canvas><div class="shade"></div><div class="hud"><div class="topHud"><div class="pill live">LIVE　結婚記念杯</div><div id="phase" class="pill phase">発走前</div></div><div id="videoNotice" class="videoNotice">REALTIME RACE • 操作連動</div><div id="leaderboard" class="leaderboard"></div><div id="commentary" class="commentary">各馬ゲート入り。参加者の準備を待っています。</div><div class="raceStrip"><div class="trackLine"></div><div class="finishLine"></div><div class="startLabel">START</div><div class="finishLabel">GOAL</div><div id="runnerDots"></div></div><div id="countdown" class="countdown hidden"></div><div id="winner" class="winner hidden"><div><div style="letter-spacing:.25em;color:#e8cc88;font-weight:900">WINNER</div><div id="winnerNo" class="winnerNo"></div><div id="winnerName" class="winnerName"></div><div id="finishList" class="finishList"></div></div></div></div></div></section>
<section id="player" class="card hidden"><div class="row between"><div>ROOM <span id="pRoom" class="code"></span></div><div><span id="connDot" class="connDot"></span><span id="connText" class="tiny">接続中</span></div></div><div class="playerHead"><div id="pNum" class="playerNo">1</div><div><div class="tiny">あなたの馬</div><div id="pName" style="font-size:24px;font-weight:1000">ゲスト1</div><div id="pBride" class="bride"></div></div></div><div class="row between"><b>スタミナ</b><span id="pSt">100%</span></div><div class="meter"><div id="pFill" class="meterFill"></div></div><div id="pStatus" class="playerStatus">発走を待っています</div><button id="readyBtn" class="btn dark large full">準備OK</button><button id="tapBtn" class="tap" disabled>追う！</button><div class="row between" style="margin-top:11px"><span id="tapCount">0連打</span><span id="pRank">現在 − 位</span></div><div id="pResult" class="result"></div></section>
</div><div id="error" class="error hidden"></div>
<script>
(()=>{
const POSTER_URL='/race-poster.png';
const CINEMATIC_URL='';
const COLORS=['#f5f5f5','#202020','#d43e35','#3180d5','#e4ca33','#36a261','#ed8930','#db6eaa','#8164c4'];
const TEXT=['#111','#fff','#fff','#fff','#111','#fff','#fff','#fff','#fff'];
const $=id=>document.getElementById(id);const socket=io({transports:['websocket','polling']});
const qs=new URLSearchParams(location.search);let mode=qs.get('mode')||'landing',roomCode=(qs.get('room')||'').toUpperCase(),room=null,mySlot=null,myToken=null,ready=false,localTaps=0,pendingTaps=0,lastFinishCount=0,filmStarted=false;
$('racePoster').src=POSTER_URL;if(CINEMATIC_URL){const f=$('raceFilm');f.src=CINEMATIC_URL;f.muted=true;f.load();f.classList.remove('hidden');}
function show(id){['landing','joinCard','host','screenOnly','raceView','player'].forEach(x=>$(x)&&$(x).classList.add('hidden'));$(id)&&$(id).classList.remove('hidden')}
function err(msg){$('error').textContent=msg;$('error').classList.remove('hidden');setTimeout(()=>$('error').classList.add('hidden'),4000)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function urlFor(m,c){return location.origin+'/?mode='+m+'&room='+encodeURIComponent(c)}
function rankList(){if(!room)return[];return [...room.horses].sort((a,b)=>{if(a.finish!=null&&b.finish!=null)return a.finish-b.finish;if(a.finish!=null)return-1;if(b.finish!=null)return 1;return b.progress-a.progress})}
function rankOf(slot){return rankList().findIndex(h=>h.slot===slot)+1}
function openJoin(){roomCode=$('joinCode').value.trim().toUpperCase();if(roomCode.length!==5)return err('5文字のルームコードを入力してください');$('joinCodeView').textContent=roomCode;show('joinCard')}
$('newRace').onclick=()=>socket.emit('createRoom',{count:8},res=>{if(!res.ok)return err('ルームを作れませんでした');room=res.room;roomCode=room.code;mode='host';history.replaceState({},'',urlFor('host',roomCode));setupHost()});
$('joinOpen').onclick=()=>$('joinBox').classList.remove('hidden');$('joinNext').onclick=openJoin;$('joinCode').onkeydown=e=>{if(e.key==='Enter')openJoin()};
$('joinRace').onclick=()=>{const name=$('playerName').value.trim();if(!name)return err('名前を入力してください');const key='wd-token-'+roomCode;socket.emit('joinRoom',{code:roomCode,name,slot:+$('horseSlot').value,token:localStorage.getItem(key)||null},res=>{if(!res.ok)return err(res.error==='SLOT_TAKEN'?'その番号は参加済みです。別の番号を選んでください':res.error==='ROOM_FULL'?'満員です':'ルームが見つかりません');room=res.room;mySlot=res.slot;myToken=res.token;localStorage.setItem(key,myToken);localStorage.setItem(key+'-name',name);mode='player';history.replaceState({},'',urlFor('player',roomCode));setupPlayer()})};
function setupHost(){show('host');$('raceView').classList.remove('hidden');$('roomCode').textContent=roomCode;$('joinUrl').textContent=urlFor('player',roomCode);$('screenUrl').textContent=urlFor('screen',roomCode);$('qr').innerHTML='';if(window.QRCode)new QRCode($('qr'),{text:urlFor('player',roomCode),width:150,height:150,correctLevel:QRCode.CorrectLevel.M});renderHost();renderRace()}
function setupScreen(){show('screenOnly');$('raceView').classList.remove('hidden');$('screenCode').textContent=roomCode;socket.emit('screenJoin',{code:roomCode},res=>{if(!res.ok)return err('ルームが見つかりません');room=res.room;renderRace()})}
function setupPlayer(){show('player');$('pRoom').textContent=roomCode;$('connDot').classList.add('on');$('connText').textContent='接続済み';renderPlayer()}
$('count').onchange=()=>socket.emit('hostConfig',{count:+$('count').value,names:[...document.querySelectorAll('#hostNames input')].map(x=>x.value)});$('startRace').onclick=()=>socket.emit('startRace');$('resetRace').onclick=()=>socket.emit('resetRace');$('fullBtn').onclick=$('screenFull').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('stage').requestFullscreen?.();
$('readyBtn').onclick=()=>{ready=!ready;socket.emit('ready',{ready});$('readyBtn').textContent=ready?'準備OK ✓':'準備OK'};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&mode==='player'&&room?.status==='running'){e.preventDefault();pendingTaps++;localTaps++}});
$('tapBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(!room||room.status!=='running')return;pendingTaps++;localTaps++;$('tapCount').textContent=localTaps+'回 追う'});setInterval(()=>{if(pendingTaps&&mode==='player'){socket.emit('tapBatch',{count:pendingTaps});pendingTaps=0}},100);
socket.on('connect',()=>{if(mode==='host'&&roomCode)socket.emit('hostJoin',{code:roomCode},res=>{if(res.ok){room=res.room;setupHost()}else{mode='landing';show('landing');err('前のルームは終了しています')}});else if(mode==='screen'&&roomCode)setupScreen();else if(mode==='player'&&roomCode){const key='wd-token-'+roomCode,name=localStorage.getItem(key+'-name');if(name)socket.emit('joinRoom',{code:roomCode,name,token:localStorage.getItem(key)},res=>{if(res.ok){room=res.room;mySlot=res.slot;myToken=res.token;setupPlayer()}else{$('joinCodeView').textContent=roomCode;show('joinCard')}});else{$('joinCodeView').textContent=roomCode;show('joinCard')}}});
socket.on('state',state=>{if(state.code!==roomCode)return;room=state;if(mode==='host')renderHost();if(mode==='player')renderPlayer();if(mode==='host'||mode==='screen')renderRace()});socket.on('disconnect',()=>{if(mode==='player'){$('connDot').classList.remove('on');$('connText').textContent='再接続中'}});
function renderHost(){if(!room)return;$('count').value=room.count;const box=$('hostNames');if(box.children.length!==room.count){box.innerHTML=room.horses.map((h,i)=>`<div class="nameRow"><span class="numMini" style="background:${COLORS[i]};color:${TEXT[i]}">${i+1}</span><input data-slot="${i}" value="${esc(h.name)}" maxlength="14"><span id="hs${i}" class="statusTag">空き</span></div>`).join('');box.querySelectorAll('input').forEach(inp=>inp.onchange=()=>socket.emit('hostConfig',{names:[...box.querySelectorAll('input')].map(x=>x.value)}))}room.horses.forEach((h,i)=>{const e=$('hs'+i);if(!e)return;e.className='statusTag'+(h.ready?' ready':'');e.textContent=h.connected?(h.ready?'READY':'接続'):'空き'});$('joinedText').textContent=room.horses.filter(h=>h.connected).length+'/'+room.count+'人 接続';$('startRace').disabled=['countdown','running'].includes(room.status)}
function renderPlayer(){if(!room||mySlot==null)return;const h=room.horses[mySlot];if(!h)return;$('pNum').textContent=mySlot+1;$('pNum').style.background=COLORS[mySlot];$('pNum').style.color=TEXT[mySlot];$('pName').textContent=h.name;$('pBride').textContent=h.bride?'BRIDE・新婦':'';$('pSt').textContent=Math.round(h.stamina)+'% · '+((h.speed||0)*12).toFixed(1)+' km/h';$('pFill').style.width=h.stamina+'%';$('pFill').style.background=h.stamina<25?'#df574e':h.stamina<55?'#d7a03d':'#5dcc7b';$('pRank').textContent='現在 '+(rankOf(mySlot)||'−')+'位';const running=room.status==='running'&&h.finish==null;$('tapBtn').disabled=!running; if(room.status==='lobby'){localTaps=0;pendingTaps=0;$('tapCount').textContent='0回 追う';$('pResult').textContent='';} $('readyBtn').classList.toggle('hidden',room.status!=='lobby');if(room.status==='lobby')$('pStatus').textContent=ready?'準備OK・発走待ち':'「準備OK」を押してください';else if(room.status==='countdown')$('pStatus').textContent='まもなく発走！';else if(room.status==='running')$('pStatus').textContent=h.stamina<25?'スタミナ低下！手を休めて回復':'追うと加速・離すと控えて回復';else{$('pStatus').textContent='レース終了';const k=room.finishOrder.indexOf(mySlot)+1;$('pResult').textContent=k?'あなたは '+k+'着！':''}}
function commentary(sorted){if(!room)return'';const a=sorted[0]?.name||'',b=sorted[1]?.name||'';if(room.status==='lobby')return'各馬ゲート入り。参加者の準備を待っています。';if(room.status==='countdown')return'まもなくスタート！';if(room.status==='finished')return'全頭ゴール。着順確定です。';const e=room.elapsed||0;if(e<2.5)return'スタートしました！ 各馬一斉に飛び出します。';if(e<6)return'先頭は'+a+'。'+b+'が続き、向正面を進みます。';if(Math.max(...room.horses.map(h=>h.progress))<72)return'ペースを見ながらスタミナを温存。仕掛けどころが勝負です。';return'最後の直線！ '+a+'先頭、'+b+'が追う！'}
function renderRace(){if(!room)return;const sorted=rankList();$('phase').textContent=room.status==='lobby'?'発走前':room.status==='countdown'?'発走準備':room.status==='running'?(Math.max(...room.horses.map(h=>h.progress))>=72?'最後の直線':'レース中'):'確定';$('leaderboard').innerHTML=sorted.map((h,i)=>`<div class="leadRow"><span class="leadNo" style="background:${COLORS[h.slot]};color:${TEXT[h.slot]}">${h.slot+1}</span><b>${i+1}位　${esc(h.name)}${h.bride?' <span class="bride">新婦</span>':''}</b><span>${Math.round(h.progress)}%</span></div>`).join('');$('commentary').textContent=commentary(sorted);$('runnerDots').innerHTML=room.horses.map(h=>`<div class="runnerDot${h.bride?' brideDot':''}" style="left:${4+92*(Math.max(0,Math.min(100,h.progress))/100)}%;background:${COLORS[h.slot]};color:${TEXT[h.slot]}">${h.slot+1}</div>`).join('');if(room.status==='countdown'){const n=Math.max(1,Math.ceil((room.startAt-Date.now())/1000));$('countdown').textContent=n;$('countdown').classList.remove('hidden')}else $('countdown').classList.add('hidden');if(room.status==='finished'){const w=room.finishOrder[0];$('winnerNo').textContent=w+1;$('winnerNo').style.color=COLORS[w];$('winnerName').textContent=room.horses[w].name;$('finishList').innerHTML=room.finishOrder.map((slot,i)=>`${i+1}着　<span style="display:inline-block;width:29px;border-radius:5px;background:${COLORS[slot]};color:${TEXT[slot]}">${slot+1}</span>　${esc(room.horses[slot].name)}`).join('<br>');$('winner').classList.remove('hidden')}else $('winner').classList.add('hidden')}
function syncFilm(){const film=$('raceFilm'),poster=$('racePoster');if(room.status==='lobby'){film.pause();filmStarted=false;poster.classList.remove('moving');try{film.currentTime=0}catch{};return}if(room.status==='countdown'){film.pause();filmStarted=false;poster.classList.remove('moving');void poster.offsetWidth;poster.classList.add('moving');try{film.currentTime=0}catch{};return}if(room.status==='running'){poster.classList.add('moving');if(CINEMATIC_URL){film.classList.remove('hidden');const desired=Math.min(14.4,Math.max(0,room.elapsed||0));if(Math.abs(film.currentTime-desired)>.8)try{film.currentTime=desired}catch{};if(film.paused)film.play().catch(()=>{})}}else if(room.status==='finished'){film.pause()}}
// Procedural perspective renderer. Horse coordinates come only from server state.
const canvas=$('raceCanvas'),ctx=canvas.getContext('2d');
let displayed=[],frameAt=performance.now();
function horse(x,y,scale,h,t){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 const phase=t*(h.speed||0)*5+h.slot, bob=Math.sin(phase)*2;
 ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,7,38,9,0,0,7);ctx.fill();
 ctx.translate(0,bob);
 const coat=['#76503b','#352b28','#9e6840','#5c3928','#b18d60','#49342a','#81624c','#e3d4c0','#796c61'][h.slot];
 ctx.lineCap='round';
 for(let i=0;i<4;i++){let fx=i<2?-23:22, swing=Math.sin(phase+(i%2)*Math.PI)*17;ctx.strokeStyle=coat;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(fx,-14);ctx.lineTo(fx+swing*.5,0);ctx.lineTo(fx+swing,15);ctx.stroke();ctx.strokeStyle='#241f1c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(fx+swing,12);ctx.lineTo(fx+swing+5,16);ctx.stroke();}
 ctx.strokeStyle='#2a211d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-33,-30);ctx.quadraticCurveTo(-49,-29,-48,-14+Math.sin(phase)*8);ctx.stroke();
 ctx.fillStyle=coat;ctx.beginPath();ctx.ellipse(0,-27,35,16,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(18,-32);ctx.lineTo(28,-61);ctx.lineTo(41,-63);ctx.lineTo(51,-48);ctx.lineTo(42,-41);ctx.lineTo(31,-40);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(30,-60);ctx.lineTo(29,-72);ctx.lineTo(36,-62);ctx.fill();ctx.fillStyle='#171713';ctx.fillRect(40,-57,3,3);
 ctx.fillStyle=COLORS[h.slot];ctx.fillRect(-14,-42,27,24);ctx.fillStyle=TEXT[h.slot];ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(h.slot+1,0,-23);
 ctx.strokeStyle=h.bride?'#fff':COLORS[h.slot];ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(-2,-45);ctx.lineTo(12,-58);ctx.lineTo(27,-52);ctx.stroke();
 ctx.fillStyle='#f4c9ac';ctx.beginPath();ctx.arc(19,-67,7,0,7);ctx.fill();ctx.fillStyle=h.bride?'#fff':COLORS[h.slot];ctx.beginPath();ctx.arc(18,-70,8,Math.PI,Math.PI*2);ctx.fill();
 if(h.bride){ctx.fillStyle='#fff9';ctx.beginPath();ctx.moveTo(13,-73);ctx.lineTo(-24,-47);ctx.lineTo(5,-52);ctx.fill();}
 ctx.fillStyle='#061811dd';ctx.fillRect(-34,-100,68,22);ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.fillText((h.slot+1)+' '+h.name.slice(0,4),0,-84);ctx.restore();
}
function draw(now){
 const dt=Math.min(.05,(now-frameAt)/1000);frameAt=now;
 const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);
 const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#93a4a8');sky.addColorStop(.36,'#d9d5bd');sky.addColorStop(.37,'#2c593b');sky.addColorStop(1,'#426947');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#536663';for(let i=0;i<28;i++){ctx.fillRect(i*w/28,h*.18, w/30,h*.11);ctx.fillStyle=i%2?'#6b7770':'#536663';}
 const lead=room?Math.max(...room.horses.map(x=>x.progress)):0;
 ctx.fillStyle='#8d7857';ctx.beginPath();ctx.moveTo(w*.16,h*.36);ctx.lineTo(w*.68,h*.36);ctx.lineTo(w*1.4,h);ctx.lineTo(-w*.6,h);ctx.fill();
 for(let i=0;i<=9;i++){ctx.strokeStyle=i===0||i===9?'#f4f0d5':'#d3c19a55';ctx.lineWidth=i===0||i===9?4:1;ctx.beginPath();ctx.moveTo(w*(.16+i*.058),h*.36);ctx.lineTo(w*(-.6+i*.223),h);ctx.stroke();}
 for(let i=0;i<16;i++){const z=((i/16+lead*.02)%1);const yy=h*(.36+.64*z*z);ctx.strokeStyle='#ead9ae44';ctx.beginPath();ctx.moveTo(w*(.16-.76*z*z),yy);ctx.lineTo(w*(.68+.72*z*z),yy);ctx.stroke();}
 if(room){room.horses.forEach((v,i)=>{if(displayed[i]==null||room.status==='lobby')displayed[i]=v.progress;displayed[i]+=(v.progress-displayed[i])*Math.min(1,dt*12)});
 const list=room.horses.map(v=>{let gap=lead-displayed[v.slot];let y=h*(.73-Math.min(35,gap)*.009);let depth=(y/h-.36)/.64;let lane=(v.slot+.5)/room.count;return{v,y,x:w*((.16-.76*depth)+lane*(.52+1.48*depth)),scale:Math.max(.32,depth*1.1)}}).sort((a,b)=>a.y-b.y);
 for(const o of list)horse(o.x,o.y,o.scale,o.v,now/1000);
 if(lead>83){const y=h*(.75+(100-lead)*.02);ctx.fillStyle='#fff';ctx.fillRect(0,y,w,5);ctx.font='bold 20px sans-serif';ctx.fillText('FINISH',w*.45,y-8);}
 }
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
if(mode==='screen'&&roomCode){show('screenOnly');$('raceView').classList.remove('hidden')}else if(mode==='host'&&roomCode){show('host');$('raceView').classList.remove('hidden')}else if(mode==='player'&&roomCode){$('joinCodeView').textContent=roomCode;show('joinCard')}else show('landing');
})();
