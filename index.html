<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>結婚記念杯</title><style>body{margin:0;background:#102c22;color:#fff;font-family:system-ui}main{max-width:850px;margin:auto;padding:15px}h1{text-align:center;color:#f3d08b}button,select,input{font:inherit;padding:10px;border-radius:8px}button{background:#efc46d;border:0;font-weight:bold}button:disabled{opacity:.4}.panel{background:#214b39;padding:14px;border-radius:12px;margin:12px 0}.lane{height:39px;position:relative;background:repeating-linear-gradient(0deg,#326e42 0 19px,#3d7c4b 19px 38px);border-bottom:1px solid #aaa}.horse{position:absolute;top:5px;white-space:nowrap;transition:left .1s linear;font-size:21px}.finish{position:absolute;right:6%;top:0;bottom:0;width:9px;background:repeating-linear-gradient(0deg,white 0 8px,black 8px 16px);z-index:3}#track{position:relative;overflow:hidden;border:4px solid #b68d52;border-radius:9px}#tap{width:100%;height:95px;font-size:25px;touch-action:manipulation}#meter{height:16px;background:#163629;border-radius:8px;overflow:hidden}#fill{height:100%;background:#5fd282;width:100%}input{width:110px;margin:3px}#result{white-space:pre-line;line-height:1.8}</style></head><body><main><h1>🏆 結婚記念杯</h1><p style="text-align:center">WEDDING DERBY · スマホ連打レース</p><div class="panel"><label>出走頭数 <select id="count"><option>6</option><option selected>8</option><option>9</option></select></label>　<label>操作馬 <select id="pick"></select></label><div id="names"></div><button id="start">レース開始</button> <button id="reset">リセット</button><span id="clock" style="float:right">45.0秒</span></div><div id="track"><div class="finish"></div></div><div class="panel"><p id="phase">出走準備中</p><div>スタミナ <span id="st">100%</span></div><div id="meter"><div id="fill"></div></div><p id="taps">0連打</p><button id="tap" disabled>🏇 連打して走れ！</button><p id="result"></p></div><small>試遊版：1人対CPU。9人同時オンライン対戦とリアル3Dは今後の実装が必要です。</small></main><script>
const $=x=>document.getElementById(x);let hs=[],chosen=0,running=false,ended=false,begin=0,last=0,interval=null,taps=0;const colors=['white','#222','#e33','#49f','#ed3','#4e8','#f93','#f7a','#a8f'];function init(){clearInterval(interval);running=false;ended=false;taps=0;chosen=0;hs=Array.from({length:+$('count').value},(_,i)=>({name:'ゲスト'+(i+1),p:0,s:100,done:false,time:null}));$('pick').innerHTML=hs.map((h,i)=>'<option value="'+i+'">'+(i+1)+'番</option>').join('');$('names').innerHTML=hs.map((h,i)=>'<input aria-label="馬名'+(i+1)+'" maxlength="12" data-i="'+i+'" value="'+h.name+'">').join('');$('names').querySelectorAll('input').forEach(e=>e.oninput=()=>{hs[+e.dataset.i].name=e.value||'ゲスト'+(+e.dataset.i+1);draw()});$('start').disabled=false;$('tap').disabled=true;$('pick').disabled=false;$('count').disabled=false;$('clock').textContent='45.0秒';$('phase').textContent='出走準備中';$('result').textContent='';$('taps').textContent='0連打';draw();meter()}function meter(){let s=hs[chosen].s;$('fill').style.width=s+'%';$('st').textContent=Math.round(s)+'%'}function draw(){$('track').querySelectorAll('.lane').forEach(x=>x.remove());hs.forEach((h,i)=>{let l=document.createElement('div');l.className='lane';l.style.borderLeft='7px solid '+colors[i];let a=document.createElement('div');a.className='horse';a.style.left=Math.min(79,h.p*.79)+'%';a.textContent='🏇 '+(i+1)+' '+h.name+(h.done?' ✓':'');l.appendChild(a);$('track').appendChild(l)})}function finish(){running=false;ended=true;clearInterval(interval);$('tap').disabled=true;$('start').disabled=false;$('pick').disabled=false;$('count').disabled=false;$('phase').textContent='全頭ゴール・着順確定';let ranks=hs.map((h,i)=>({...h,i})).sort((a,b)=>a.time-b.time);$('result').textContent=ranks.map((h,i)=>(i+1)+'着 '+h.name+' '+h.time.toFixed(1)+'秒').join('\n')}function tick(){if(!running)return;let now=performance.now(),dt=Math.min(.25,(now-last)/1000);last=now;let sec=(now-begin)/1000,sprint=sec>=30;$('clock').textContent=Math.max(0,45-sec).toFixed(1)+'秒';$('phase').textContent=sprint?'🔥 最後の直線！':'道中・スタミナを調整';hs.forEach((h,i)=>{if(h.done)return;h.s=Math.min(100,h.s+dt*(sprint?3:4.5));let speed=(i===chosen?.42:.48)+(i!==chosen?Math.random()*.24:0);h.p+=dt*speed*(sprint?1.35:1);if(i!==chosen&&Math.random()<dt*(sprint?7:5)&&h.s>8){h.p+=sprint?.85:.52;h.s-=sprint?3:2}if(sec>=45)h.p+=dt*(1.7+(i%4)*.2);if(h.p>=100){h.p=100;h.done=true;h.time=sec} });draw();meter();if(hs.every(h=>h.done))finish()}$('count').onchange=init;$('pick').onchange=()=>{chosen=+$('pick').value;meter()};$('reset').onclick=init;$('start').onclick=()=>{hs.forEach(h=>{h.p=0;h.s=100;h.done=false;h.time=null});taps=0;running=true;begin=performance.now();last=begin;$('start').disabled=true;$('tap').disabled=false;$('pick').disabled=true;$('count').disabled=true;$('result').textContent='';clearInterval(interval);interval=setInterval(tick,100);draw()};$('tap').onpointerdown=e=>{e.preventDefault();if(!running||hs[chosen].done)return;let h=hs[chosen],sprint=performance.now()-begin>=30000;h.p+= (h.s<12?.09:h.s<35?.20:.38)*(sprint?2:1);h.s=Math.max(0,h.s-(sprint?1.45:1.2));if(h.p>=100){h.p=100;h.done=true;h.time=(performance.now()-begin)/1000;$('tap').disabled=true}taps++;$('taps').textContent=taps+'連打';meter();draw()};init();
</script></body></html>
