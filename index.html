<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>結婚記念杯 | Wedding Derby</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07150f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1280px;margin:auto;padding:10px}.hero{text-align:center;padding:10px;border-radius:14px;background:linear-gradient(135deg,#153a2b,#0a2118);border:1px solid #365b49}.hero h1{margin:2px;color:#f4d18a;letter-spacing:.12em;font-size:28px}.hero small{color:#cbd8d0}
.panel{background:#113326;border:1px solid #315b48;border-radius:13px;padding:10px;margin-top:9px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;border-radius:9px;border:1px solid #4d705f;padding:8px 9px}select,input{background:#0b251a;color:#fff}button{background:#e7bd65;color:#241a0b;font-weight:800}button.secondary{background:#183c2d;color:#fff}button:disabled{opacity:.4}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-top:8px}.names label{display:flex;gap:5px;align-items:center;font-size:11px}.names input{min-width:0;width:100%}
#stage{height:min(60vw,650px);min-height:370px;position:relative;overflow:hidden;border-radius:14px;border:2px solid #b08c50;margin-top:9px;background:#a8c5d1;box-shadow:0 15px 40px #0008}
#three{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:0;left:0;right:0;padding:9px;display:flex;justify-content:space-between;background:linear-gradient(#06150fd9,transparent)}
.live,.phase,.cam{background:#091e16df;border:1px solid #ffffff22;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800;backdrop-filter:blur(4px)}.live:before{content:"";display:inline-block;width:7px;height:7px;background:#f33;border-radius:50%;margin-right:6px}.cam{position:absolute;left:10px;top:49px}
.board{position:absolute;right:10px;top:49px;width:180px;background:#071a13e8;border:1px solid #ffffff22;border-radius:9px;padding:6px}.lb{display:grid;grid-template-columns:19px 13px 1fr;gap:5px;align-items:center;padding:3px 0;border-bottom:1px solid #ffffff12;font-size:11px}.lb:last-child{border:0}.cloth{height:12px;border-radius:2px;border:1px solid #ffffff88}
.call{position:absolute;left:10px;bottom:10px;max-width:76%;background:#071a13e8;border:1px solid #ffffff22;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;line-height:1.45}.goal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#07150fa8;font-size:46px;font-weight:900;color:#ffe09a;text-shadow:0 4px 20px #000}.goal.show{display:flex;animation:g .85s ease}@keyframes g{0%{opacity:0;transform:scale(.85)}45%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1)}}
.meter{height:15px;border-radius:99px;background:#0a2419;border:1px solid #355b49;overflow:hidden}.meter div{height:100%;background:#58c977;width:100%}#tap{width:100%;height:104px;margin-top:8px;font-size:26px;touch-action:manipulation;user-select:none;box-shadow:0 5px 0 #ad8138}#tap:active{transform:translateY(3px);box-shadow:0 2px 0 #ad8138}
#result{white-space:pre-line;text-align:center;line-height:1.75;font-weight:800;margin-top:8px}.note{font-size:10px;color:#c0d0c7;margin-top:7px}
@media(max-width:700px){.hero h1{font-size:23px}#stage{height:440px}.board{width:150px}.call{max-width:92%;font-size:11px}.names{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<section class="hero"><small>WEDDING DERBY 2026</small><h1>結 婚 記 念 杯</h1><small>リアル競馬中継風 3Dレース</small></section>
<section class="panel"><div class="row"><div class="controls">
<label>頭数 <select id="count"><option>6</option><option selected>8</option><option>9</option></select></label>
<label>操作馬 <select id="pick"></select></label>
</div><div class="controls"><button id="start">発走</button><button id="reset" class="secondary">リセット</button><button id="fullscreen" class="secondary">全画面</button><span id="clock">45.0秒</span></div></div><div id="names" class="names"></div></section>
<section id="stage"><canvas id="three"></canvas><div class="hud"><div class="topbar"><div class="live">LIVE　結婚記念杯</div><div class="phase" id="phase">発走前</div></div><div class="cam" id="cam">CAM 1　追走</div><div class="board" id="board"></div><div class="call" id="call">各馬ゲート入り。まもなくスタートです。</div><div class="goal" id="goal">GOAL!</div></div></section>
<section class="panel"><div class="row"><strong>スタミナ</strong><span id="stamina">100%</span></div><div class="meter"><div id="fill"></div></div><div class="row" style="margin-top:7px"><span id="msg">スタート待機</span><span id="taps">0連打</span></div><button id="tap" disabled>🏇 連打して加速！</button><div id="result"></div><div class="note">現在は1人対CPUの映像試作。連打・スタミナ・ラスト15秒の逆転・全頭完走に対応。会場スクリーン向けにカメラが自動切替します。</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.min.js"></script>
<script>
(()=>{
const $=x=>document.getElementById(x);
const cloth=['#f7f7f7','#171717','#d43131','#2f7bd4','#e8c92c','#35a265','#ef8c32','#d96fa7','#8465c8'];
const coat=[0x693d25,0x2c211b,0x8a5d3c,0x4c3124,0x2a211b,0x784a2d,0x573525,0x956645,0x392820];
let H=[],sel=0,run=false,t0=0,last=0,timer=null,taps=0,order=[],renderer,scene,camera,meshes=[],gate,finishX=52;
function M(c,r=.8){return new THREE.MeshStandardMaterial({color:c,roughness:r})}
function horse(i){
 const g=new THREE.Group(), cm=M(coat[i%coat.length]), dm=M(0x21150f,.92), bm=M(0x0d0b09,.96);
 let b=new THREE.Mesh(new THREE.SphereGeometry(1,26,16),cm);b.scale.set(1.9,.82,.76);b.castShadow=true;g.add(b);
 let chest=new THREE.Mesh(new THREE.SphereGeometry(.68,20,14),cm);chest.scale.set(.9,1,.9);chest.position.set(.92,.22,0);g.add(chest);
 let neck=new THREE.Mesh(new THREE.CylinderGeometry(.31,.51,1.7,14),cm);neck.rotation.z=-.58;neck.position.set(1.4,.84,0);g.add(neck);
 let head=new THREE.Mesh(new THREE.SphereGeometry(.5,20,14),cm);head.scale.set(1.18,.72,.72);head.position.set(2.1,1.37,0);g.add(head);
 let muzzle=new THREE.Mesh(new THREE.SphereGeometry(.25,14,10),dm);muzzle.scale.set(1.35,.7,.85);muzzle.position.set(2.55,1.2,0);g.add(muzzle);
 [-1,1].forEach(s=>{let e=new THREE.Mesh(new THREE.ConeGeometry(.09,.3,8),cm);e.position.set(2.1,1.82,s*.25);e.rotation.z=-.15;g.add(e)});
 let tail=new THREE.Mesh(new THREE.CylinderGeometry(.09,.03,1.55,8),bm);tail.position.set(-1.98,.25,0);tail.rotation.z=.92;g.add(tail);
 const legs=[];[[-.9,.38],[-.72,-.38],[.72,.38],[.9,-.38]].forEach((p,k)=>{let lg=new THREE.Group();let u=new THREE.Mesh(new THREE.CylinderGeometry(.095,.115,1.42,8),dm);u.position.y=-.47;lg.add(u);let hf=new THREE.Mesh(new THREE.BoxGeometry(.23,.17,.2),bm);hf.position.y=-1.18;lg.add(hf);lg.position.set(p[0],-.12,p[1]);legs.push(lg);g.add(lg)});
 let saddle=new THREE.Mesh(new THREE.BoxGeometry(1,.16,.9),M(parseInt(cloth[i].slice(1),16),.65));saddle.position.set(-.05,.74,0);g.add(saddle);
 let torso=new THREE.Mesh(new THREE.CylinderGeometry(.22,.29,.72,10),M(parseInt(cloth[i].slice(1),16),.55));torso.position.set(.03,1.23,0);torso.rotation.z=-.18;g.add(torso);
 let jh=new THREE.Mesh(new THREE.SphereGeometry(.2,12,8),M(0xe1ad86,.7));jh.position.set(.17,1.67,0);g.add(jh);let helm=new THREE.Mesh(new THREE.SphereGeometry(.23,12,8),M(parseInt(cloth[i].slice(1),16),.5));helm.scale.y=.65;helm.position.set(.17,1.82,0);g.add(helm);
 g.userData={legs,phase:i*.8};return g;
}
function init3(){
 renderer=new THREE.WebGLRenderer({canvas:$('three'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
 scene=new THREE.Scene();scene.background=new THREE.Color(0xb2c9d2);scene.fog=new THREE.Fog(0xb2c9d2,70,175);
 camera=new THREE.PerspectiveCamera(42,1,.1,260);scene.add(new THREE.HemisphereLight(0xffffff,0x315b36,2.25));let sun=new THREE.DirectionalLight(0xffffff,2.6);sun.position.set(-30,45,28);sun.castShadow=true;scene.add(sun);
 let turf=new THREE.Mesh(new THREE.PlaneGeometry(220,46),M(0x3d7f47,1));turf.rotation.x=-Math.PI/2;turf.position.x=35;scene.add(turf);
 for(let z=-15;z<=15;z+=3.8){let stripe=new THREE.Mesh(new THREE.PlaneGeometry(220,.055),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.1}));stripe.rotation.x=-Math.PI/2;stripe.position.set(35,.015,z);scene.add(stripe)}
 let railM=M(0xf7f7f7,.6);[-17,17].forEach(z=>{let r=new THREE.Mesh(new THREE.BoxGeometry(220,.16,.16),railM);r.position.set(35,1,z);scene.add(r);for(let x=-70;x<140;x+=4){let p=new THREE.Mesh(new THREE.BoxGeometry(.12,1.9,.12),railM);p.position.set(x,.1,z);scene.add(p)}})
 gate=new THREE.Group();for(let i=0;i<9;i++){let box=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.6,2.4),new THREE.MeshStandardMaterial({color:0x5c6b60,wireframe:true}));box.position.set(-49,1.2,(i-4)*3.15);gate.add(box)}scene.add(gate);
 let line=new THREE.Mesh(new THREE.BoxGeometry(.16,.02,40),new THREE.MeshBasicMaterial({color:0xffffff}));line.position.set(finishX,.03,0);scene.add(line);
 for(let k=0;k<10;k++){let post=new THREE.Mesh(new THREE.BoxGeometry(.35,2.3,.35),M(k%2?0xffffff:0x202020,.6));post.position.set(finishX,1.15,-18+k*4);scene.add(post)}
 let stand=new THREE.Mesh(new THREE.BoxGeometry(100,10,13),M(0x6d7880,.9));stand.position.set(15,5,-34);scene.add(stand);let roof=new THREE.Mesh(new THREE.BoxGeometry(105,.6,16),M(0xd7dde0,.7));roof.position.set(15,10.3,-34);scene.add(roof);
 resize();addEventListener('resize',resize);anim();
}
function resize(){let s=$('stage').getBoundingClientRect();renderer.setSize(s.width,s.height,false);camera.aspect=s.width/s.height;camera.updateProjectionMatrix()}
function rebuild(){meshes.forEach(m=>scene.remove(m));meshes=[];H.forEach((h,i)=>{let m=horse(i);m.position.set(-45,.9,(i-(H.length-1)/2)*3.05);scene.add(m);meshes.push(m)})}
function setup(){clearInterval(timer);run=false;sel=0;taps=0;order=[];let n=+$('count').value;H=Array.from({length:n},(_,i)=>({name:'ゲスト'+(i+1),p:0,s:100,done:false,time:null,base:.61+Math.random()*.16,burst:0}));$('pick').innerHTML=H.map((h,i)=>'<option value="'+i+'">'+(i+1)+'番</option>').join('');$('names').innerHTML=H.map((h,i)=>'<label><b>'+(i+1)+'番</b><input maxlength="12" data-i="'+i+'" value="'+h.name+'"></label>').join('');$('names').querySelectorAll('input').forEach(e=>e.oninput=()=>{let i=+e.dataset.i;H[i].name=e.value.trim()||'ゲスト'+(i+1);board()});$('start').disabled=false;$('tap').disabled=true;$('pick').disabled=false;$('count').disabled=false;$('clock').textContent='45.0秒';$('phase').textContent='発走前';$('cam').textContent='CAM 1　追走';$('call').textContent='各馬ゲート入り。まもなくスタートです。';$('result').textContent='';$('taps').textContent='0連打';gate.visible=true;rebuild();meter();board()}
function meter(){let s=H[sel]?.s??100;$('fill').style.width=s+'%';$('fill').style.background=s<25?'#e45c50':s<55?'#dda33d':'#58c977';$('stamina').textContent=Math.round(s)+'%'}
function ranks(){return H.map((h,i)=>({i,p:h.p,time:h.time})).sort((a,b)=>{if(a.time!=null&&b.time!=null)return a.time-b.time;if(a.time!=null)return -1;if(b.time!=null)return 1;return b.p-a.p})}
function board(){let r=ranks();$('board').innerHTML=r.slice(0,5).map((x,k)=>'<div class="lb"><b>'+(k+1)+'</b><span class="cloth" style="background:'+cloth[x.i]+'"></span><span>'+H[x.i].name+'</span></div>').join('')}
function say(sec){let r=ranks(),lead=H[r[0].i],second=H[r[1]?.i||r[0].i];if(sec<2)return 'スタートしました！ 各馬一斉に飛び出しました。';if(sec<12)return '先頭は'+lead.name+'。馬群はまだ一団、各馬ポジションを探ります。';if(sec<25)return lead.name+'が先頭。'+second.name+'がその直後、後方勢も徐々に差を詰めます。';if(sec<30)return '第4コーナーへ。ここから各馬、最後の脚を残せるか。';if(sec<40)return '直線に入りました！ '+lead.name+'先頭！ 外から後続が一気に迫る！';return 'ゴール前！ '+lead.name+'が粘る！ 後続も追い込む！'}
function logic(){if(!run)return;let now=performance.now(),dt=Math.min(.22,(now-last)/1000);last=now;let sec=(now-t0)/1000,sprint=sec>=30;$('clock').textContent=sec<45?Math.max(0,45-sec).toFixed(1)+'秒':'延長';$('phase').textContent=sprint?'最後の直線':'レース中';$('msg').textContent=sprint?'差せ！ラストスパート！':'連打と休憩でスタミナ調整';$('call').textContent=say(sec);
 H.forEach((h,i)=>{if(h.done)return;h.s=Math.min(100,h.s+dt*(sprint?3:4.6));let pace=h.base*(h.s<15?.63:1)*(sprint?1.20:1);if(i!==sel&&Math.random()<dt*(sprint?5.4:3.9)&&h.s>8){h.burst+=sprint?1.04:.56;h.s-=sprint?3.1:2}h.p+=dt*pace+h.burst;h.burst=0;if(sec>45)h.p+=dt*(1.7+(i%3)*.15);if(h.p>=100){h.p=100;h.done=true;h.time=sec;order.push(i);if(i===sel)$('tap').disabled=true;$('goal').classList.remove('show');void $('goal').offsetWidth;$('goal').classList.add('show')}});board();meter();if(H.every(h=>h.done))end()}
function end(){run=false;clearInterval(timer);$('tap').disabled=true;$('start').disabled=false;$('pick').disabled=false;$('count').disabled=false;$('phase').textContent='全頭ゴール';$('call').textContent='全頭ゴールしました。着順確定です。';$('result').textContent='🏆 着順確定\n'+order.map((i,k)=>(k+1)+'着 '+H[i].name+'　'+H[i].time.toFixed(1)+'秒').join('\n')}
function anim(){requestAnimationFrame(anim);let sec=run?(performance.now()-t0)/1000:0,lead=Math.max(0,...H.map(h=>h.p));
 meshes.forEach((m,i)=>{let h=H[i];if(!h)return;m.position.x=-45+h.p*.97;let sp=h.done?0:1+Math.min(2,h.p/60);m.userData.phase+=.052*sp;m.position.y=.9+Math.sin(m.userData.phase*2)*.09;m.userData.legs.forEach((l,k)=>l.rotation.z=Math.sin(m.userData.phase*3.6+(k%2)*Math.PI)*.58)});
 if(!run){camera.position.set(-12,20,34);camera.lookAt(-3,1,0);$('cam').textContent='CAM 1　追走'}
 else if(sec<25){let x=-30+lead*.63;camera.position.lerp(new THREE.Vector3(x,13,31),.035);camera.lookAt(x+8,1,0);$('cam').textContent='CAM 1　横追い'}
 else if(sec<34){let x=-10+lead*.55;camera.position.lerp(new THREE.Vector3(x+12,16,25),.035);camera.lookAt(x+2,1,0);$('cam').textContent='CAM 2　第4コーナー'}
 else if(sec<43){let x=-2+lead*.53;camera.position.lerp(new THREE.Vector3(x-2,9,22),.04);camera.lookAt(x+14,1,0);$('cam').textContent='CAM 3　最後の直線'}
 else{camera.position.lerp(new THREE.Vector3(finishX+7,7,25),.04);camera.lookAt(finishX-8,1,0);$('cam').textContent='CAM 4　ゴール前'}
 renderer.render(scene,camera)}
$('count').onchange=setup;$('pick').onchange=()=>{sel=+$('pick').value;meter()};$('reset').onclick=setup;$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('stage').requestFullscreen?.();
$('start').onclick=()=>{H.forEach(h=>{h.p=0;h.s=100;h.done=false;h.time=null;h.burst=0});order=[];taps=0;run=true;t0=performance.now();last=t0;gate.visible=false;$('start').disabled=true;$('tap').disabled=false;$('pick').disabled=true;$('count').disabled=true;$('result').textContent='';$('taps').textContent='0連打';clearInterval(timer);timer=setInterval(logic,90)};
$('tap').onpointerdown=e=>{e.preventDefault();if(!run)return;let h=H[sel];if(!h||h.done)return;let sprint=performance.now()-t0>=30000,p=h.s<12?.08:h.s<35?.18:.34;h.p=Math.min(100,h.p+p*(sprint?2.15:1));h.s=Math.max(0,h.s-(sprint?1.5:1.2));taps++;$('taps').textContent=taps+'連打';meter()};
init3();setup();
})();
</script></body></html>
